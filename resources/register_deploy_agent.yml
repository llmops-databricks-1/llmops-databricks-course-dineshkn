resources:
  jobs:
    register-deploy-agent:
      name: causal-inference-agent-register-deploy-pipeline
      tags:
        project_name: "causal-inference-curator"
        environment: ${bundle.target}
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - ${workspace.root_path}/artifacts/.internal/causal_inference_curator-0.0.1-py3-none-any.whl

      tasks:
        - task_key: log_register_agent
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/log_register_agent.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"

        - task_key: deploy_agent
          depends_on:
            - task_key: log_register_agent
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/deploy_agent.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
